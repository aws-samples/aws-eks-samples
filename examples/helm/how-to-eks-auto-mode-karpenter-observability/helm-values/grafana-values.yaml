# Values for the grafana-community/grafana chart.
# The admin password is generated by the chart and stored in the "grafana" Secret.

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      version: 1
      url: http://prometheus-server:80
      access: proxy
      isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/default

# ConfigMap created by scripts/setup.sh from dashboards/karpenter-impact.json
dashboardsConfigMaps:
  default: grafana-dashboards

# ClusterIP only: Grafana is not reachable from outside the cluster.
# Reach it from your workstation with:
#   kubectl -n monitoring port-forward svc/grafana 3000:80
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 3000
