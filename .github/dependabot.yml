# Dependabot version updates.
# Each entry needs a unique package-ecosystem + directory pair; a duplicate
# makes the whole file invalid and Dependabot runs nothing.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # GitHub Actions used in .github/workflows (directory "/" means the default location)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base image of the tcpdump troubleshooting sample
  - package-ecosystem: "docker"
    directory: "/examples/kubernetes/how-to-tshoot-eks-intermittent-network-issues/manifests"
    schedule:
      interval: "weekly"
